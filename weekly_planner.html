<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>七日行事曆｜Weekly Planner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ChenYuluoyan+TH&display=swap');
:root{--bg:#f6f1e7;--card:#fbf8f2;--line:#e4d9ca;--ink:#75634f;--muted:#a39480;--today:#d8c6ad;--accent:#b99e7e;--urgent:#d7a18e;--important:#dfcf9f;--normal:#e6e2d9;--green:#a9b59a;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'ChenYuluoyan TH',sans-serif;font-size:18px;letter-spacing:.03em}
button,input,select,textarea{font:inherit;color:inherit}button{border:0;cursor:pointer;transition:.18s}button:hover{filter:brightness(.96);transform:translateY(-1px)}
.wrap{max-width:850px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.brand{font-size:34px;line-height:1.1}.sub{color:var(--muted);font-size:16px;margin-top:5px}.today-btn,.add-btn{background:var(--accent);color:#fff;border-radius:12px;padding:10px 16px}
.progress-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px}.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.bar{height:8px;background:#e9e1d5;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:var(--green);transition:width .25s}
.days{display:flex;flex-direction:column;gap:14px}.day{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;position:relative;overflow:hidden}.day.today{background:#efe5d6;border-color:#c8b49b;box-shadow:0 4px 16px #9c84631a}.day.today:before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:#b89d7d}.dayhead{display:flex;align-items:center;gap:13px;margin-bottom:12px}.datebox{width:64px;min-width:64px;text-align:center;background:#e9dfd1;border-radius:13px;padding:6px}.today .datebox{background:var(--today)}.weekday{font-size:15px;color:#897965}.num{font-size:30px;line-height:1}.dayinfo{flex:1}.daytitle{font-size:21px}.today-tag{display:inline-block;color:#fff;background:#9c8365;border-radius:20px;padding:2px 9px;font-size:14px;margin-top:3px}.day-add{background:#f0e8dc;border:1px dashed #d3c4b1;color:#887763;width:100%;border-radius:12px;padding:9px;margin:8px 0 0}.tasks{display:flex;flex-direction:column;gap:9px}.task{background:#f5f0e7;border-radius:12px;padding:10px 11px;border:1px solid #ebe2d7}.task.done{opacity:.58}.task.done .taskname{text-decoration:line-through}.tasktop{display:flex;align-items:flex-start;gap:8px}.taskname{flex:1;font-size:19px;white-space:pre-wrap;overflow-wrap:anywhere}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0}.tag{font-size:14px;border-radius:10px;padding:2px 8px}.urgent{background:#f1ddd3;color:#a45f4c}.important{background:#eee4c9;color:#927a42}.normal{background:#e7e3dc;color:#77746b}.taskmeta{font-size:15px;color:#968672;margin-top:4px}.actions{display:flex;gap:7px;align-items:center}.iconbtn{background:#e9dfd1;color:#79664f;border-radius:9px;padding:5px 8px;font-size:17px}.delete{background:#eee0db;color:#a66e5e}.check{background:#dfe7d8;color:#708263}.empty{color:#b2a28d;font-size:16px;padding:4px 2px}.modal-bg{position:fixed;inset:0;background:#473b2f66;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal-bg.open{display:flex}.modal{background:var(--card);border-radius:18px;padding:20px;width:min(440px,100%);box-shadow:0 15px 50px #44351f33}.modal h2{font-size:25px;margin:0 0 12px}.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;background:#f7f2e9;padding:9px;outline:none}.field textarea{resize:vertical;min-height:65px}.checks{display:flex;gap:10px;flex-wrap:wrap}.checks label{background:#f1e9dd;border-radius:10px;padding:5px 9px;display:flex;align-items:center;gap:5px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.cancel{background:#e8e0d5;border-radius:10px;padding:9px 14px}.save{background:var(--accent);color:white;border-radius:10px;padding:9px 14px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#77644f;color:white;border-radius:20px;padding:8px 14px;display:none;z-index:10}.toast.show{display:block}
@media(min-width:700px){.wrap{padding-top:38px}.day{padding:18px 20px}.brand{font-size:42px}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="brand">My Weekly Planner</div><div class="sub" id="range"></div></div><button class="today-btn" id="jumpToday">回到今天</button></header>
<section class="progress-card"><div class="progress-row"><span>今日完成進度</span><strong id="progressText">0 / 0</strong></div><div class="bar"><span id="progressBar"></span></div></section>
<div class="days" id="days"></div></main>
<div class="modal-bg" id="modalBg"><div class="modal"><h2 id="modalTitle">新增事項</h2><form id="taskForm"><input type="hidden" id="taskId"><input type="hidden" id="taskDate"><div class="field"><label>事項名稱 *</label><input id="name" required maxlength="180" placeholder="今天要完成什麼？"></div><div class="field"><label>時間（選填）</label><input id="time" type="time"></div><div class="field"><label>分類（選填）</label><input id="category" maxlength="40" placeholder="例如：讀書、作業、生活"></div><div class="field"><label>備註（選填）</label><textarea id="note" maxlength="500" placeholder="補充內容…"></textarea></div><div class="field"><label>標籤（可複選）</label><div class="checks"><label><input type="checkbox" value="urgent"> 緊急</label><label><input type="checkbox" value="important"> 重要</label><label><input type="checkbox" value="normal" checked> 一般</label></div></div><div class="modal-actions"><button type="button" class="cancel" id="cancel">取消</button><button class="save" type="submit">儲存</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const STORAGE='creamWeeklyPlanner_v1';let tasks=load();let editMode=false;
function load(){try{return JSON.parse(localStorage.getItem(STORAGE)||'[]')}catch{return []}}
function persist(){localStorage.setItem(STORAGE,JSON.stringify(tasks));render()}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseKey(k){let [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function todayKey(){return dateKey(new Date())}
function dayOffset(k,n){let d=parseKey(k);d.setDate(d.getDate()+n);return dateKey(d)}
function fmt(d,opts){return new Intl.DateTimeFormat('zh-TW',opts).format(d)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function render(){const today=todayKey(),days=document.getElementById('days');days.innerHTML='';let keys=Array.from({length:7},(_,i)=>dayOffset(today,i));document.getElementById('range').textContent=`${fmt(parseKey(keys[0]),{month:'long',year:'numeric'})} · ${fmt(parseKey(keys[0]),{day:'numeric'})} — ${fmt(parseKey(keys[6]),{month:'short',day:'numeric'})}`;
keys.forEach(k=>{let d=parseKey(k),isToday=k===today,list=tasks.filter(t=>t.date===k).sort((a,b)=>(a.time||'').localeCompare(b.time||''));let card=document.createElement('section');card.className='day'+(isToday?' today':'');card.id='day-'+k;card.innerHTML=`<div class="dayhead"><div class="datebox"><div class="weekday">${fmt(d,{weekday:'short'})}</div><div class="num">${d.getDate()}</div></div><div class="dayinfo"><div class="daytitle">${fmt(d,{month:'long',day:'numeric'})} · ${fmt(d,{weekday:'long'})}</div>${isToday?'<span class="today-tag">TODAY · 今天</span>':''}</div></div><div class="tasks">${list.length?list.map(taskHTML).join(''):'<div class="empty">今天還沒有安排事項</div>'}</div><button class="day-add" data-add="${k}">＋ 新增事項</button>`;days.appendChild(card)});
days.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openModal(b.dataset.add));days.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggleTask(b.dataset.toggle));days.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editTask(b.dataset.edit));days.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteTask(b.dataset.delete));updateProgress();}
function taskHTML(t){let tags=(t.tags||[]).map(tag=>tag==='urgent'?'<span class="tag urgent">緊急</span>':tag==='important'?'<span class="tag important">重要</span>':'<span class="tag normal">一般</span>').join('');return `<div class="task ${t.done?'done':''}"><div class="tasktop"><div class="taskname">${esc(t.name)}</div><div class="actions"><button class="iconbtn check" title="完成/取消完成" data-toggle="${t.id}">${t.done?'↶':'✓'}</button><button class="iconbtn" title="編輯" data-edit="${t.id}">✎</button><button class="iconbtn delete" title="刪除" data-delete="${t.id}">×</button></div></div><div class="tags">${tags}</div>${t.time||t.category?`<div class="taskmeta">${t.time?esc(t.time):''}${t.time&&t.category?' · ':''}${t.category?esc(t.category):''}</div>`:''}${t.note?`<div class="taskmeta">${esc(t.note)}</div>`:''}</div>`}
function updateProgress(){let today=tasks.filter(t=>t.date===todayKey()),done=today.filter(t=>t.done).length,total=today.length;document.getElementById('progressText').textContent=`${done} / ${total}`;document.getElementById('progressBar').style.width=total?`${done/total*100}%`:'0%'}
function openModal(date){editMode=false;document.getElementById('modalTitle').textContent='新增事項';document.getElementById('taskId').value='';document.getElementById('taskDate').value=date;document.getElementById('name').value='';document.getElementById('time').value='';document.getElementById('category').value='';document.getElementById('note').value='';document.querySelectorAll('.checks input').forEach(c=>c.checked=c.value==='normal');document.getElementById('modalBg').classList.add('open');document.getElementById('name').focus()}
function editTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;editMode=true;document.getElementById('modalTitle').textContent='編輯事項';document.getElementById('taskId').value=id;document.getElementById('taskDate').value=t.date;document.getElementById('name').value=t.name;document.getElementById('time').value=t.time||'';document.getElementById('category').value=t.category||'';document.getElementById('note').value=t.note||'';document.querySelectorAll('.checks input').forEach(c=>c.checked=(t.tags||[]).includes(c.value));document.getElementById('modalBg').classList.add('open')}
function closeModal(){document.getElementById('modalBg').classList.remove('open')}
document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();let id=document.getElementById('taskId').value,tags=[...document.querySelectorAll('.checks input:checked')].map(c=>c.value);let obj={id:id||crypto.randomUUID(),date:document.getElementById('taskDate').value,name:document.getElementById('name').value.trim(),time:document.getElementById('time').value,category:document.getElementById('category').value.trim(),note:document.getElementById('note').value.trim(),tags,done:id?(tasks.find(t=>t.id===id)?.done||false):false};if(id)tasks=tasks.map(t=>t.id===id?obj:t);else tasks.push(obj);persist();closeModal();showToast(id?'已更新事項':'已新增事項')};
function toggleTask(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);persist()}
function deleteTask(id){if(!confirm('確定要刪除這個事項嗎？'))return;tasks=tasks.filter(t=>t.id!==id);persist();showToast('事項已刪除')}
document.getElementById('cancel').onclick=closeModal;document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};document.getElementById('jumpToday').onclick=()=>document.getElementById('day-'+todayKey()).scrollIntoView({behavior:'smooth',block:'start'});
// Date range is calculated from the actual current date on each render; no stored day index to drift.
render();setInterval(()=>{let current=todayKey();if(window._lastToday!==current){window._lastToday=current;render();}},60000);window._lastToday=todayKey();
</script></body></html>
